<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Move Ijuí — Motorista</title>
  <link rel="stylesheet" href="styles.css">
</head>
<!--
  Os módulos JavaScript não abrem pelo protocolo file://.
  Na pasta UI, use um servidor HTTP local:

    python -m http.server 5500

  Depois abra http://localhost:5500/

  O padrão é o modo demonstração: o mapa começa com o motorista online
  e a oferta só entra pelo painel ao lado do celular.
  Para a oferta automática do modo normal, abra http://localhost:5500/?modo=normal

  A Plus Jakarta Sans está em fonts/, sob a SIL Open Font License (fonts/OFL.txt).
-->
<body>
  <div class="stage">
    <aside class="demo" aria-label="Controles de demonstração">
      <p class="demo-label">Demonstração</p>
      <p class="demo-note" id="demo-note"></p>
      <button type="button" id="demo-reset">Reiniciar cenário</button>
      <button type="button" id="demo-offer">Disparar oferta</button>
      <button type="button" id="demo-expire">Expirar oferta</button>
    </aside>
    <div class="phone" id="phone">
      <div class="statusbar" aria-hidden="true">
        <span>07:45</span>
        <span class="statusbar-icons">
          <svg width="15" height="12" viewBox="0 0 15 12" fill="none"><path d="M1 8.5h2V11H1zM5.5 6h2v5h-2zM10 3h2v8h-2z" fill="#14241c"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 4.5C3.2 2.2 6.4 1 8 1s4.8 1.2 7 3.5" stroke="#14241c" stroke-width="1.4" stroke-linecap="round"/><path d="M3.2 6.8c1.4-1.3 3-2 4.8-2s3.4.7 4.8 2" stroke="#14241c" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="10" r="1.2" fill="#14241c"/></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x="0.7" y="0.7" width="18" height="10.6" rx="2" stroke="#14241c" stroke-width="1.4"/><rect x="2" y="2" width="12" height="8" rx="1" fill="#14241c"/><path d="M20 4v4" stroke="#14241c" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
      </div>
      <header class="app-header" id="header"></header>
      <div class="view" id="view"></div>
      <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
      <div id="dialog-root"></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
